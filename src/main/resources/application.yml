server:
  port: 8080

spring:
  application:
    name: grade-management

  datasource:
    # 本地默认连本机 MySQL 的 grade_management 库；部署到 Railway 时用环境变量覆盖
    # 如果本机 root 密码不是 root，请把 ${DB_PASSWORD:root} 里的默认值改成你的密码
    url: ${DB_URL:jdbc:mysql://localhost:3306/grade_management?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.grade.entity
  configuration:
    # 数据库下划线字段自动映射为实体驼峰字段（如 class_name -> className）
    map-underscore-to-camel-case: true

logging:
  level:
    com.grade.mapper: debug
