<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>课程管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="topbar">
        <span class="brand"><span class="logo"><i class="fa-solid fa-graduation-cap"></i></span>班级学生成绩管理系统</span>
        <span><a href="/home">首页</a> <a href="/logout">退出登录</a></span>
    </div>
    <div class="container">
        <div class="card">
        <h2>课程管理</h2>

    <form action="/admin/course/add" method="post">
        课程名称：<input name="courseName" required>
        学分：<input name="credit" type="number" step="0.5">
        <button>新增</button>
    </form>

    <table border="1" cellpadding="6" cellspacing="0">
        <tr><th>ID</th><th>名称 / 学分</th><th>操作</th></tr>
        <tr th:each="c : ${courses}">
            <td th:text="${c.id}"></td>
            <td>
                <form action="/admin/course/edit" method="post">
                    <input type="hidden" name="id" th:value="${c.id}">
                    <input name="courseName" th:value="${c.courseName}">
                    <input name="credit" type="number" step="0.5" th:value="${c.credit}">
                    <button>保存</button>
                </form>
            </td>
            <td><a th:href="@{/admin/course/delete(id=${c.id})}" onclick="return confirm('确定删除该课程？')">删除</a></td>
        </tr>
    </table>

    <br>
    <a href="/home">返回首页</a>
        </div>
    </div>
</body>
</html>
