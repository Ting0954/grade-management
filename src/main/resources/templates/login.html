<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 - 班级学生成绩管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="logo"><i class="fa-solid fa-graduation-cap"></i></div>
            <h2>班级学生成绩管理系统</h2>
            <p class="sub">请输入账号密码登录</p>

            <div th:if="${error}" class="msg msg-err" th:text="${error}"></div>

            <form action="/login" method="post">
                <input type="text" name="username" placeholder="用户名" required>
                <input type="password" name="password" placeholder="密码" required>
                <button type="submit"><i class="fa-solid fa-right-to-bracket"></i> 登 录</button>
            </form>

            <div class="tips">
                测试账号：<br>
                管理员　<b>admin</b> / admin123<br>
                教师　　<b>t001</b> / 123456<br>
                学生　　<b>s001</b> / 123456
            </div>
        </div>
    </div>
</body>
</html>
