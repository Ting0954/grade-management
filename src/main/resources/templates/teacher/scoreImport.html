<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>成绩导入</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="topbar">
        <span class="brand"><span class="logo"><i class="fa-solid fa-graduation-cap"></i></span>班级学生成绩管理系统</span>
        <span><a href="/home">首页</a> <a href="/logout">退出登录</a></span>
    </div>
    <div class="container">
        <div class="card">
        <h2>批量导入成绩</h2>

    <p>说明：先<strong>导出成绩表</strong>，在 Excel 里改好后另存为 CSV 再上传；或直接上传 CSV 文件。</p>
    <p>CSV 格式：<code>学号,姓名,平时成绩,期中成绩,期末成绩</code>（首行表头可保留）</p>

    <form action="/teacher/score/import" method="post" enctype="multipart/form-data">
        <label>课程：
            <select name="courseId">
                <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.courseName}"></option>
            </select>
        </label>
        &nbsp;&nbsp;
        <label>班级：
            <select name="classId">
                <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.className}"></option>
            </select>
        </label>
        &nbsp;&nbsp;
        <label>学期：
            <select name="termId">
                <option th:each="t : ${terms}" th:value="${t.id}" th:text="${t.termName}"></option>
            </select>
        </label>
        <br><br>
        <label>选择 CSV 文件：
            <input type="file" name="file" accept=".csv" required>
        </label>
        <br><br>
        <button type="submit">上传导入</button>
    </form>

    <br>
    <a href="/teacher/score/select">返回成绩录入</a> |
    <a href="/home">返回首页</a>
        </div>
    </div>
</body>
</html>
