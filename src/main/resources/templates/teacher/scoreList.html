<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>成绩录入 - 学生名单</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="topbar">
        <span class="brand"><span class="logo"><i class="fa-solid fa-graduation-cap"></i></span>班级学生成绩管理系统</span>
        <span><a href="/home">首页</a> <a href="/logout">退出登录</a></span>
    </div>

    <div class="container">
        <div class="card">
            <h2>录入成绩</h2>

            <form action="/teacher/score/save" method="post">
                <input type="hidden" name="courseId" th:value="${courseId}">
                <input type="hidden" name="classId" th:value="${classId}">
                <input type="hidden" name="termId" th:value="${termId}">

                <table>
                    <tr>
                        <th>学号</th>
                        <th>姓名</th>
                        <th>平时成绩</th>
                        <th>期中成绩</th>
                        <th>期末成绩</th>
                    </tr>
                    <tr th:each="it : ${items}">
                        <input type="hidden" name="studentId" th:value="${it.studentId}">
                        <td th:text="${it.studentNo}"></td>
                        <td th:text="${it.name}"></td>
                        <td><input type="number" step="0.1" min="0" max="100"
                                   th:name="'usual_' + ${it.studentId}" th:value="${it.usualScore}"></td>
                        <td><input type="number" step="0.1" min="0" max="100"
                                   th:name="'mid_' + ${it.studentId}" th:value="${it.midScore}"></td>
                        <td><input type="number" step="0.1" min="0" max="100"
                                   th:name="'final_' + ${it.studentId}" th:value="${it.finalScore}"></td>
                    </tr>
                </table>

                <br>
                <button type="submit">保存成绩</button>
            </form>

            <br>
            <a href="/teacher/score/select">返回重新选择</a> |
            <a class="btn" th:href="@{/teacher/score/export(courseId=${courseId}, classId=${classId}, termId=${termId})}">导出成绩表(Excel)</a> |
            <a href="/teacher/score/importSelect">批量导入</a>
        </div>
    </div>
</body>
</html>
